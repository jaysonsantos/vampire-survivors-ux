name: CI

# The mod build needs the interop assemblies that BepInEx makes from the game files.
# Those files belong to poncle and are not in the repository, so CI cannot build the mod.
# CI checks the shell scripts and the repository content instead.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell scripts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck
          shellcheck tools/*.sh
      - name: Check that no game files are in the repository
        run: |
          set -e
          if git ls-files | grep -E '^reference/|\.dll$|\.exe$|global-metadata\.dat$'; then
            echo "Game files or binaries are in the repository."
            exit 1
          fi
          echo "OK"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Check the loader matrix in the C# project
        run: |
          set -eu
          P=src/VampireSurvivorsUx/VampireSurvivorsUx.csproj
          fail=0
          # $1 loader, $2 expected TargetFramework, $3 expected compile symbols
          check() {
            tfm=$(dotnet msbuild "$P" -nologo -p:Loader="$1" -getProperty:TargetFramework)
            syms=$(dotnet msbuild "$P" -nologo -p:Loader="$1" -getProperty:DefineConstants)
            echo "Loader=$1 TargetFramework=$tfm DefineConstants=$syms"
            if [ "$tfm" != "$2" ]; then
              echo "  TargetFramework must be $2"
              fail=1
            fi
            for s in $3; do
              if ! printf '%s' "$syms" | grep -q "$s"; then
                echo "  DefineConstants must contain $s"
                fail=1
              fi
            done
          }
          check MelonLoader net6.0 'MELONLOADER IL2CPP'
          check BepInEx net6.0 'BEPINEX IL2CPP'
          check BepInExMono netstandard2.1 'BEPINEX_MONO MONO'
          exit "$fail"
